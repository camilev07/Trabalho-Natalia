name: CD - Deploy no GitHub Pages

# Dispara sempre que houver código novo na main (merge de PR ou push)
on:
  push:
    branches:
      - main

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys simultâneos
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Garantir que index.html existe
        run: test -f index.html

      - name: Montar pasta de publicação (apenas arquivos do site)
        run: |
          mkdir _site
          cp index.html style.css _site/
          cp -r assets _site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Etapa 4: notificação via GitHub Actions (abre uma Issue; o GitHub avisa por e-mail)
  notify-failure:
    name: Notificar falha
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir Issue de alerta
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Deploy falhou - ${context.sha.substring(0, 7)}`,
              body: `O deploy no GitHub Pages **falhou**.\n\n- Commit: ${context.sha}\n- Autor: @${context.actor}\n- Execução: ${runUrl}`,
              assignees: [context.repo.owner]
            });
